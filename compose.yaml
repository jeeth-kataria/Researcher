services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: rgi
      POSTGRES_PASSWORD: rgi
      POSTGRES_DB: rgi
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgi -d rgi"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
