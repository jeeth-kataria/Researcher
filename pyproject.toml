[project]
name = "research-gap-investigator"
version = "0.1.0"
description = "Local evidence-first research workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.7",
  "pydantic-settings==2.9.1", "python-multipart==0.0.20",
  "pypdf==5.6.0", "langgraph==0.4.8", "langgraph-checkpoint-sqlite==2.0.10",
  "groq==0.28.0", "google-genai==1.20.0", "httpx==0.28.1"
]
[project.optional-dependencies]
worker = ["docling==2.36.1", "sentence-transformers==4.1.0", "transformers==4.52.4"]
dev = ["pytest==8.4.0", "reportlab==4.4.1", "ruff==0.11.13"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/rgi"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: real on-disk SQLite integration", "provider: opt-in live provider quota consumption"]
[tool.ruff]
line-length = 110
